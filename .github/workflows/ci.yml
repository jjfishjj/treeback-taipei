name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Check, unit, contracts and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - name: Install pinned package manager
        run: npm install --global pnpm@11.25.0
      - name: Install locked test dependencies
        run: pnpm install --frozen-lockfile
      - name: Check JavaScript syntax
        run: pnpm check
      - name: Test model and public data contracts
        run: pnpm test
      - name: Install Chromium and operating-system dependencies
        run: pnpm exec playwright install --with-deps chromium
      - name: Test built site on desktop and mobile
        run: pnpm test:e2e
      - name: Build static website
        run: pnpm build
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-failure-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
